{% extends 'taskboard/base.html' %}
{% block content %}
<h1>Create Task</h1>
<form method="post" novalidate>
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit" class="btn">Create</button>
    <a href="{% url 'taskboard:dashboard' %}" class="btn muted">Cancel</a>
</form>
{% endblock %}
