{% extends 'taskboard/base.html' %}

{% block title %}Update Status - TaskBoard{% endblock %}

{% block content %}
<h1>✏️ Update Status for "{{ task.title }}"</h1>
<form method="POST">
    {% csrf_token %}
    <div class="form-group">
        <label for="status">Select New Status</label>
        <select name="status" id="status">
            {% for s in allowed %}
                <option value="{{ s }}" {% if s == task.status %}selected{% endif %}>
                    {% if s == 'Done' %}✓{% elif s == 'Doing' %}⏳{% else %}📌{% endif %}
                    {{ s }}
                </option>
            {% endfor %}
        </select>
    </div>

    <div class="btn-group">
        <button type="submit" class="btn" style="flex: 1;">💾 Update</button>
        <a href="{% url 'taskboard:task_detail' task.pk %}" class="btn muted" style="flex: 1; text-align: center;">Cancel</a>
    </div>
</form>
{% endblock %}
