services:
  web:
    build: .
    command: sh -c "cd config && python manage.py runserver 0.0.0.0:8000"
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    depends_on:
      - redis
  
  worker:
    build: .
    command: sh -c "cd /app/config && celery -A config worker --loglevel=info"
    volumes:
      - .:/app
    depends_on:
      - redis
  
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"